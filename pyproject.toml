[project]
name = "macro-peru-agent"
version = "0.1.0"
description = "Analista Macro Perú: agente de IA en Azure Databricks con datos del BCRP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests",
    "pyyaml",
    "pydantic",
    "tenacity",
    "playwright>=1.64.1",
]

[project.optional-dependencies]
agent = [
    "mlflow[databricks]>=3.1",
    "databricks-agents",
    "databricks-langchain",
    "langgraph",
    "databricks-vectorsearch",
    "databricks-sdk",
    "unitycatalog-ai[databricks]",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pypdf",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_peru"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that hit the Databricks workspace or external APIs"]
